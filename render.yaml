services:
  - type: web
    name: wellness-centre-api
    runtime: node
    plan: free
    buildCommand: "pnpm install --frozen-lockfile && pnpm exec tsc -p backend/tsconfig.json"
    startCommand: "node backend/dist/index.js"
    preDeployCommand: "pnpm exec tsx backend/scripts/migrate.ts && pnpm exec tsx backend/scripts/seed.ts"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://wellness-centre-project.vercel.app
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
