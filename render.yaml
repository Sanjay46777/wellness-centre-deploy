services:
  - type: web
    name: wellness-centre-api
    env: node
    plan: free
    buildCommand: "pnpm install && pnpm exec tsc -p backend/tsconfig.json"
    startCommand: "node backend/dist/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend-url.vercel.app
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
