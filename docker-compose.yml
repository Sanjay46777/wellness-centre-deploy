version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: wellness-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wellness_centre}
      MYSQL_USER: ${MYSQL_USER:-wellness}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wellness}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wellness-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3001}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-wellness}
      DB_PASSWORD: ${DB_PASSWORD:-wellness}
      DB_NAME: ${DB_NAME:-wellness_centre}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:50000}
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
